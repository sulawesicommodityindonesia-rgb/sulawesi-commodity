<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sulawesi Commodity Indonesia</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #f7f3ed;
  color: #333;
  line-height: 1.6;
}

header {
  background: #3b2416;
  color: white;
  padding: 18px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo {
  font-size: 21px;
  font-weight: bold;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 18px;
  font-size: 14px;
}

.hero {
  min-height: 520px;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: white;
  padding: 80px 20px;

  background:
    linear-gradient(rgba(50,25,15,0.65), rgba(50,25,15,0.65)),
    url("https://images.unsplash.com/photo-1606312619070-d48b4c652a52?auto=format&fit=crop&w=1600&q=80");

  background-size: cover;
  background-position: center;
}

.hero-content {
  max-width: 750px;
}

.hero h1 {
  font-size: 40px;
  margin-bottom: 18px;
}

.hero p {
  font-size: 18px;
  margin-bottom: 25px;
}

.button {
  display: inline-block;
  padding: 13px 24px;
  background: #a66a20;
  color: white;
  text-decoration: none;
  border-radius: 7px;
  font-weight: bold;
}

section {
  padding: 70px 7%;
}

.section-title {
  text-align: center;
  margin-bottom: 35px;
}

.section-title h2 {
  color: #3b2416;
  font-size: 30px;
}

.section-title p {
  margin-top: 10px;
}

.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 25px;
}

.card {
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 15px rgba(0,0,0,0.10);
}

.card img {
  width: 100%;
  height: 220px;
  object-fit: cover;
  display: block;
}

.card-content {
  padding: 22px;
}

.card h3 {
  color: #3b2416;
  font-size: 24px;
  margin-bottom: 10px;
}

.card p {
  margin-bottom: 15px;
}

.card a {
  color: #a66a20;
  font-weight: bold;
  text-decoration: none;
}

.about {
  background: white;
  text-align: center;
}

.about-box {
  max-width: 800px;
  margin: auto;
}

.contact {
  background: #3b2416;
  color: white;
  text-align: center;
}

.contact h2 {
  margin-bottom: 15px;
}

.contact p {
  max-width: 650px;
  margin: 0 auto 25px;
}

footer {
  background: #24150d;
  color: white;
  text-align: center;
  padding: 20px;
  font-size: 14px;
}

@media (max-width: 700px) {

  header {
    flex-direction: column;
    gap: 10px;
  }

  nav a {
    margin: 0 7px;
  }

  .hero h1 {
    font-size: 32px;
  }

  .hero p {
    font-size: 16px;
  }

  section {
    padding: 55px 5%;
  }
}
</style>
</head>

<body>

<header>

<div class="logo">
Sulawesi Commodity Indonesia
</div>

<nav>
<a href="#produk">Produk</a>
<a href="#tentang">Tentang</a>
<a href="#kontak">Kontak</a>
</nav>

</header>


<section class="hero">

<div class="hero-content">

<h1>
Komoditas Berkualitas dari Sulawesi
</h1>

<p>
Connecting Indonesian agricultural commodities
with domestic and international buyers.
</p>

<a class="button" href="#produk">
Lihat Produk
</a>

</div>

</section>


<section id="produk">

<div class="section-title">

<h2>
Produk Komoditas
</h2>

<p>
Komoditas Indonesia dari jaringan supplier di Sulaw
